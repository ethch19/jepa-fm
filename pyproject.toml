[project]
name = "jepa-fm"
version = "0.1.0"
description = "Foundation model using JEPA"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hydra-core>=1.3.8",
    "matplotlib>=3.11",
    "mlflow>=3.18.0",
    "monai>=1.6.1",
    "nibabel>=5.4.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyradiomics",
    "python-dotenv>=1.0",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[project.scripts]
jepa-train = "jepa_fm.pretraining.lejepa:main"
jepa-eval = "jepa_fm.evals.extract:main"
jepa-preprocess-nlst = "jepa_fm.preprocessing.nlst:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pyradiomics = { git = "https://github.com/AIM-Harvard/pyradiomics.git", rev = "8ed579383b44806651c463d5e691f3b2b57522ab" }

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_fm"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
