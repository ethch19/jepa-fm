[project]
name = "jepa-fm"
version = "0.1.0"
description = "Foundation model using JEPA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.8",
    "mlflow>=3.18.0",
    "nibabel>=5.4.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_fm"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
